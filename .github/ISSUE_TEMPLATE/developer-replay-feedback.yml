name: Developer replay feedback
description: Report a real attempt at the offline replay and evidence explorer.
title: "[Replay feedback]: "
body:
  - type: markdown
    attributes:
      value: "Please report failures as well as successes. Do not paste credentials, private benchmark prompts, private model responses, or other sensitive information. The offline demo needs no API key."
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: "e.g. Ubuntu 24.04, Python 3.12"
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Tested Git commit or package version
      description: Record the commit from the checkout or the revision specified in the invitation. If unknown, enter unknown.
    validations:
      required: true
  - type: dropdown
    id: installation_path
    attributes:
      label: Installation path
      options:
        - Git checkout and editable install
        - Git URL pip install
        - Candidate wheel
        - Other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Offline demo outcome
      options:
        - Opened the generated HTML report
        - Installed but did not generate a report
        - Installation failed
        - Did not attempt
    validations:
      required: true
  - type: input
    id: elapsed
    attributes:
      label: Approximate elapsed time in minutes
      description: Include installation and opening the report, or time until stopping. Leave blank only if no attempt was made.
  - type: textarea
    id: blockers
    attributes:
      label: What happened?
      description: Include errors or confusing steps, with sensitive information removed.
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: What does the GraphWalks finding establish in your own words?
      description: "Inspect the 200-task explorer first. This is a comprehension check, not a test of technical expertise."
  - type: dropdown
    id: local_checker
    attributes:
      label: Optional browser checker outcome
      options:
        - Checked the original local demo bundle successfully
        - Tried but encountered a problem
        - Did not attempt
  - type: textarea
    id: use_case
    attributes:
      label: Would you use this for another published model claim? Why or why not?
      description: Name a benchmark or task if relevant.
