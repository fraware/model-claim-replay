name: Stage original campaign archive (temporary branch)
on:
  push:
    branches:
      - evidence/archive-completed-openai-campaign
    paths:
      - '.github/workflows/archive-campaign-once.yml'
permissions:
  actions: read
  contents: write
concurrency:
  group: stage-original-campaign-archive
  cancel-in-progress: false
jobs:
  stage:
    if: ${{ github.repository == 'fraware/model-claim-replay' && github.ref == 'refs/heads/evidence/archive-completed-openai-campaign' && github.event_name == 'push' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify the exact historical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/fraware/model-claim-replay/actions/artifacts/14933441865/zip > "$RUNNER_TEMP/campaign.zip"
          test "$(wc -c < "$RUNNER_TEMP/campaign.zip")" -eq 37801
          printf '%s  %s\n' f6a2dc1af63a5f50be087f1db45de0145a7880ac527852ebf0be0d9ef8a3d113 "$RUNNER_TEMP/campaign.zip" | sha256sum -c -
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile
          p = Path(os.environ["RUNNER_TEMP"]) / "campaign.zip"
          with zipfile.ZipFile(p) as z:
              expected = {"plan.json", "summary.json"}
              expected.update(f"task-{i:02d}-outcome.json" for i in range(1, 17))
              expected.update(f"task-{i:02d}-intent.json" for i in range(1, 9))
              assert len(z.namelist()) == len(expected) and set(z.namelist()) == expected
              assert hashlib.sha256(z.read("plan.json")).hexdigest() == "8ef51beca6c5688634f75a54f4a38b28c6e079d7ef331595ec144d3c50133511"
              s = json.loads(z.read("summary.json"))
              assert s["status"] == "finished" and s["generation_attempted"] == 8
              assert s["overall"]["selected"] == 16
          PY
      - name: Commit only the verified ZIP on the staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api 'repos/fraware/model-claim-replay/git/ref/heads/evidence/archive-completed-openai-campaign' --jq .object.sha)"
          test "$current" = "$GITHUB_SHA"
          python - <<'PY' > "$RUNNER_TEMP/payload.json"
          import base64
          import json
          import os
          from pathlib import Path
          payload = {"message": "Retain byte-identical original OpenAI campaign evidence", "branch": "evidence/archive-completed-openai-campaign", "content": base64.b64encode((Path(os.environ["RUNNER_TEMP"]) / "campaign.zip").read_bytes()).decode("ascii")}
          print(json.dumps(payload))
          PY
          gh api --method PUT 'repos/fraware/model-claim-replay/contents/evidence/graphwalks/openai-campaign-paid-evidence-2026-11-24.zip' --input "$RUNNER_TEMP/payload.json" --jq '.commit.sha'
