name: OpenAI GraphWalks 16-task campaign preflight (no generation)
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/graphwalks-openai-campaign-preflight.yml'
permissions:
  contents: read
concurrency:
  group: graphwalks-openai-campaign-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[graphwalks]'
      - name: Verify pinned public source
        run: |
          python scripts/graphwalks_data_audit.py \
            --revision be6cc6ecf9b4d495b07d1ff53d2a16598e90fed7 \
            --sha256 537879431c72a42e3b500f80efc3047e7facb90390b6063d33679b4320985911 \
            --size-bytes 296903814 --retain-parquet --out .runs/private/openai-source
      - name: Count all prespecified prompts through the no-generation endpoint guard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          mkdir -p .runs/campaign
          python scripts/openai_graphwalks_campaign_preflight.py \
            --parquet .runs/private/openai-source/graphwalks_256k_to_1mil.parquet \
            --index .runs/private/openai-source/graphwalks-bfs-reference-index.jsonl \
            --out .runs/campaign/preflight.json
      - name: Retain all measured counts and failures
        uses: actions/upload-artifact@v6
        with:
          name: openai-campaign-preflight
          path: .runs/campaign/preflight.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
