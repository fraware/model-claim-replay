name: GraphWalks source-bound Gemini context feasibility scan

# Operational source-bound experiment, not model inference. This
# default-branch workflow update triggers an explicitly reviewed scan.
# Another run requires another explicit workflow change on main.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/graphwalks-live-token-count.yml'

permissions:
  contents: read

concurrency:
  group: graphwalks-one-time-nongenerative-token-count
  cancel-in-progress: false

jobs:
  live-token-count:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned-source reader and Gemini token-count SDK
        run: python -m pip install -e '.[graphwalks]'
      - name: Find authenticated Gemini secret using metadata only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: python scripts/graphwalks_select_gemini_secret.py
      - name: Record authenticated provider-advertised input and output limits
        run: |
          python scripts/graphwalks_model_capabilities.py \
            --out .runs/private/graphwalks-model-capabilities.json
      - name: Verify full original public dataset and source index bytes
        run: |
          python scripts/graphwalks_data_audit.py \
            --revision be6cc6ecf9b4d495b07d1ff53d2a16598e90fed7 \
            --sha256 537879431c72a42e3b500f80efc3047e7facb90390b6063d33679b4320985911 \
            --size-bytes 296903814 \
            --retain-parquet \
            --out .runs/private/graphwalks-live
      - name: Count 20 prespecified original prompts across both context bands
        run: |
          claim-replay plan-graphwalks \
            --parquet .runs/private/graphwalks-live/graphwalks_256k_to_1mil.parquet \
            --index .runs/private/graphwalks-live/graphwalks-bfs-reference-index.jsonl \
            --max-tasks 20 --max-output-tokens 8192 \
            --thinking-level xhigh \
            --out .runs/private/graphwalks-live/token-plan.json
      - name: Upload strictly redacted token-count evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: graphwalks-20-task-real-token-count-and-model-limits
          path: |
            .runs/private/graphwalks-live/token-plan.json
            .runs/private/graphwalks-model-capabilities.json
          if-no-files-found: warn
          retention-days: 90
