name: GraphWalks paid diagnostic — explicit manual authorization

# No push, pull request, schedule, or automatic generation trigger.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Pinned BFS tasks (1 short-context default; larger cohorts subject to context gate)"
        type: choice
        required: true
        default: "1"
        options:
          - "1"
          - "2"
          - "5"
          - "20"
      output_tokens:
        description: "Maximum model output plus reasoning tokens per task"
        type: choice
        required: true
        default: "16384"
        options:
          - "8192"
          - "16384"
          - "32768"
          - "65536"
      max_spend_usd:
        description: "Authorized upper reservation in USD (positive, <=100)"
        type: string
        required: true
        default: "0"
      approval:
        description: "Type AUTHORIZE_PAID_GEMINI to allow billable API generation"
        type: string
        required: true
        default: "NO"

permissions:
  contents: read

concurrency:
  group: graphwalks-explicit-paid-diagnostic
  cancel-in-progress: false

jobs:
  controlled-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Refuse reuse of paid authorization on a rerun
        shell: bash
        run: |
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "::error::Paid workflow reruns are disabled. Review prior charges and evidence, then dispatch a new explicitly authorized run."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned source reader and official token-count dependency
        run: python -m pip install -e '.[graphwalks]'
      - name: Refuse unauthorized, unbounded execution before credential selection
        env:
          APPROVAL: ${{ inputs.approval }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          TASKS: ${{ inputs.tasks }}
        run: |
          python scripts/graphwalks_pilot_gate.py \
            --approval "$APPROVAL" --max-spend-usd "$MAX_SPEND_USD" --tasks "$TASKS"
      - name: Select authenticated Gemini credential before source download
        id: gemini_credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
        run: python scripts/graphwalks_select_gemini_secret.py --alias-only
      - name: Independently download and verify original public benchmark bytes
        run: |
          python scripts/graphwalks_data_audit.py \
            --revision be6cc6ecf9b4d495b07d1ff53d2a16598e90fed7 \
            --sha256 537879431c72a42e3b500f80efc3047e7facb90390b6063d33679b4320985911 \
            --size-bytes 296903814 \
            --retain-parquet \
            --out .runs/private/pilot-source
      - name: Count original provider tokens without generation
        env:
          GEMINI_API_KEY: ${{ (steps.gemini_credential.outputs.alias == 'GEMINI_API_KEY' && secrets.GEMINI_API_KEY) || (steps.gemini_credential.outputs.alias == 'GOOGLE_API_KEY' && secrets.GOOGLE_API_KEY) || (steps.gemini_credential.outputs.alias == 'GOOGLE_GENAI_API_KEY' && secrets.GOOGLE_GENAI_API_KEY) || '' }}
          TASKS: ${{ inputs.tasks }}
          OUTPUT_TOKENS: ${{ inputs.output_tokens }}
        run: |
          claim-replay plan-graphwalks \
            --parquet .runs/private/pilot-source/graphwalks_256k_to_1mil.parquet \
            --index .runs/private/pilot-source/graphwalks-bfs-reference-index.jsonl \
            --max-tasks "$TASKS" --max-output-tokens "$OUTPUT_TOKENS" \
            --thinking-level xhigh \
            --out .runs/private/pilot-source/token-plan.json
      - name: Refuse partial-coverage plans or over-budget generation
        env:
          APPROVAL: ${{ inputs.approval }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          TASKS: ${{ inputs.tasks }}
        run: |
          python scripts/graphwalks_pilot_gate.py \
            --approval "$APPROVAL" --max-spend-usd "$MAX_SPEND_USD" \
            --tasks "$TASKS" \
            --plan .runs/private/pilot-source/token-plan.json \
            --index .runs/private/pilot-source/graphwalks-bfs-reference-index.jsonl
      - name: Perform explicitly authorized sequential single-attempt model calls
        id: paid_execution
        # Preserve time for a post-failure audit of durable request intents.
        timeout-minutes: 330
        env:
          GEMINI_API_KEY: ${{ (steps.gemini_credential.outputs.alias == 'GEMINI_API_KEY' && secrets.GEMINI_API_KEY) || (steps.gemini_credential.outputs.alias == 'GOOGLE_API_KEY' && secrets.GOOGLE_API_KEY) || (steps.gemini_credential.outputs.alias == 'GOOGLE_GENAI_API_KEY' && secrets.GOOGLE_GENAI_API_KEY) || '' }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
        run: |
          claim-replay execute-graphwalks \
            --parquet .runs/private/pilot-source/graphwalks_256k_to_1mil.parquet \
            --index .runs/private/pilot-source/graphwalks-bfs-reference-index.jsonl \
            --plan .runs/private/pilot-source/token-plan.json \
            --max-spend-usd "$MAX_SPEND_USD" --execute-paid \
            --out .runs/private/pilot-run
      - name: Independently audit the private response journal, including interrupted runs
        id: private_audit
        # A failed paid step may leave possibly billable intent files.
        # Retain their redacted status whenever the runner is still available.
        if: ${{ !cancelled() && steps.paid_execution.outcome != 'skipped' }}
        run: |
          claim-replay audit-graphwalks \
            --plan .runs/private/pilot-source/token-plan.json \
            --index .runs/private/pilot-source/graphwalks-bfs-reference-index.jsonl \
            --run-dir .runs/private/pilot-run \
            --out .runs/private/pilot-audit.json
      - name: Export private answers and score against original F1
        # A journal audit remains publishable after a runner failure; scored
        # results are emitted only following successful execution and audit.
        if: ${{ !cancelled() && steps.paid_execution.outcome == 'success' && steps.private_audit.outcome == 'success' }}
        run: |
          claim-replay export-graphwalks \
            --plan .runs/private/pilot-source/token-plan.json \
            --index .runs/private/pilot-source/graphwalks-bfs-reference-index.jsonl \
            --run-dir .runs/private/pilot-run \
            --out .runs/private/pilot-responses.jsonl
          claim-replay grade-graphwalks \
            --index .runs/private/pilot-source/graphwalks-bfs-reference-index.jsonl \
            --responses .runs/private/pilot-responses.jsonl \
            --index-sha256 250d80874ad9bc8edf278cf3bf7aa145da3f2b34967c5504b8fa8703358480ee \
            --dataset-revision be6cc6ecf9b4d495b07d1ff53d2a16598e90fed7 \
            --out .runs/private/pilot-scores-pending.json
      - name: Cross-check redacted evidence before publishing scored results
        # Prevent a score artifact from being published if its statuses,
        # denominators, reservations or SHA-256 bindings disagree with the audit.
        if: ${{ !cancelled() && steps.paid_execution.outcome == 'success' && steps.private_audit.outcome == 'success' }}
        run: |
          claim-replay verify-graphwalks-public \
            --plan .runs/private/pilot-source/token-plan.json \
            --audit .runs/private/pilot-audit.json \
            --grades .runs/private/pilot-scores-pending.json \
            --out .runs/private/pilot-public-verification.json
          claim-replay report-graphwalks-public \
            --plan .runs/private/pilot-source/token-plan.json \
            --audit .runs/private/pilot-audit.json \
            --grades .runs/private/pilot-scores-pending.json \
            --out .runs/private/pilot-public-report.html
          mv .runs/private/pilot-scores-pending.json .runs/private/pilot-scores.json
      - name: Upload only score-free plan, redacted audit and verified task-level grades
        if: ${{ !cancelled() && github.run_attempt == 1 }}
        uses: actions/upload-artifact@v6
        with:
          name: graphwalks-pilot-redacted-self-reported-evidence
          path: |
            .runs/private/pilot-source/token-plan.json
            .runs/private/pilot-audit.json
            .runs/private/pilot-scores.json
            .runs/private/pilot-public-verification.json
            .runs/private/pilot-public-report.html
          if-no-files-found: warn
          retention-days: 90
