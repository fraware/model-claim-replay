name: OpenAI GraphWalks paid diagnostic
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Choose PREFLIGHT_ONLY (no generation) or explicitly authorize one paid GPT-6.2 Sol generation"
        required: true
        default: "PREFLIGHT_ONLY"
        type: choice
        options:
          - PREFLIGHT_ONLY
          - AUTHORIZE_PAID_OPENAI
      max_spend_usd:
        description: "USD planning ceiling for preflight; spending ceiling only if paid mode selected"
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"
          - "25"
          - "50"
          - "100"
      publication:
        description: "Separate public disclosure consent: exact canonical final answer line only"
        required: true
        default: "REDACTED_ONLY"
        type: choice
        options:
          - REDACTED_ONLY
          - PUBLISH_FINAL_LINE
permissions:
  contents: read
concurrency:
  group: openai-graphwalks-paid
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Reject paid reruns and non-main execution
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[graphwalks]'
      - name: Validate mode and ceiling before source download or credential access
        env:
          APPROVAL: ${{ inputs.approval }}
          BUDGET: ${{ inputs.max_spend_usd }}
          PUBLICATION: ${{ inputs.publication }}
        run: |
          python -c 'import os; from model_claim_replay.openai_graphwalks import dispatch_mode, validate_publication; dispatch_mode(os.environ["APPROVAL"], os.environ["BUDGET"]); validate_publication(os.environ["APPROVAL"], os.environ["PUBLICATION"])'
      - name: Independently verify pinned public dataset
        run: |
          python scripts/graphwalks_data_audit.py \
            --revision be6cc6ecf9b4d495b07d1ff53d2a16598e90fed7 \
            --sha256 537879431c72a42e3b500f80efc3047e7facb90390b6063d33679b4320985911 \
            --size-bytes 296903814 --retain-parquet --out .runs/private/openai-source
      - name: Count exact OpenAI tokens and generate only in authorized paid mode
        env:
          APPROVAL: ${{ inputs.approval }}
          BUDGET: ${{ inputs.max_spend_usd }}
          PUBLICATION: ${{ inputs.publication }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          python -m model_claim_replay.openai_graphwalks \
            --parquet .runs/private/openai-source/graphwalks_256k_to_1mil.parquet \
            --index .runs/private/openai-source/graphwalks-bfs-reference-index.jsonl \
            --out .runs/openai-diagnostic --approval "$APPROVAL" --max-spend-usd "$BUDGET" \
            --publication "$PUBLICATION"
      - name: Retain redacted evidence only
        if: ${{ !cancelled() && github.run_attempt == 1 }}
        uses: actions/upload-artifact@v6
        with:
          name: openai-graphwalks-redacted-diagnostic
          path: |
            .runs/openai-diagnostic/public/plan.json
            .runs/openai-diagnostic/public/intent.json
            .runs/openai-diagnostic/public/outcome.json
            .runs/openai-diagnostic/public/scoring-evidence.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
