name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read

# Only the newest commit on a given branch or PR should occupy CI runners.
# A PR and a branch push have distinct groups, avoiding cross-event cancellation.
# Paid, provider-readiness and deployment workflows are unaffected.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: |
          claim-replay list
          claim-replay inspect claims/claude-fable-5-2-chartography.json
  inspect-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official Inspect AI API
        run: python -m pip install -e '.[inspect]'
      - name: Exercise source-log importer with real Inspect mock-model run
        run: python -m unittest discover -s tests -p test_inspect_runtime.py -v

  chartography-upstream-smoke:
    # Separate integration check: an upstream pinned checkout with ONLY the
    # public dummy tasks and mock provider/judge. Never a benchmark result.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: model-claim-replay
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: surge-ai/chartography
          ref: 3f1bf837232d3918c2cc35c6e2418c9e70d2a57b
          path: upstream-chartography
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install importer, Inspect AI and official benchmark task
        run: |
          python -m pip install -e './model-claim-replay[inspect]'
          python -m pip install -e './upstream-chartography'
      - name: Run official two-dummy-task smoke and import its log
        run: |
          python model-claim-replay/scripts/upstream_chartography_smoke.py \
            --upstream upstream-chartography \
            --artifacts-dir model-claim-replay/.runs/chartography-smoke
      - name: Upload score-only demonstration evidence
        uses: actions/upload-artifact@v6
        with:
          name: chartography-mock-evidence
          path: model-claim-replay/.runs/chartography-smoke
          if-no-files-found: error
          retention-days: 14

  packaged-demo:
    # Verify the actual wheel from an unrelated directory, not the checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build installable wheel
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheels"
      - name: Install only the wheel and run an offline demonstration
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install "$RUNNER_TEMP"/wheels/model_claim_replay-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/consumer/bin/claim-replay" demo --out local-demo
          "$RUNNER_TEMP/consumer/bin/claim-replay" verify local-demo/run --claim local-demo/claim.json --tasks local-demo/tasks.jsonl
          "$RUNNER_TEMP/consumer/bin/python" - <<'PY'
          import json
          from pathlib import Path
          from model_claim_replay.graphwalks_public import _public_answer_list_sizes, _public_prompt_digests

          # The GraphWalks verifier must work from an installed wheel with no
          # source checkout, network access, or optional benchmark dependencies.
          commitments = _public_prompt_digests()
          sizes = _public_answer_list_sizes()
          assert len(commitments) == len(sizes) == 200
          assert commitments["bfs-row-000100"] == "8dff8adf1268f8298451e4e5c17d5f811c2cf1e5e3dab1a17cbe5ed9348956e6"
          assert commitments["bfs-row-000399"] == "a875b1bd8676b97374b7bedbefe696f4f50163c1e220a95163896665c724bc2c"
          assert sizes["bfs-row-000100"] == 9
          assert sizes["bfs-row-000300"] == 4961
          result = json.loads(Path("local-demo/report.json").read_text())
          assert result["successes"] == 2 and result["failures"] == 1
          assert result["comparison_status"] == "not_comparable"
          assert result["kind"] == "synthetic"
          assert Path("local-demo/report.html").is_file()
          PY

  website-browser:
    # Test real HTML/CSS/JS and source receipts in Chromium on two viewports.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Chromium with an OS-library fallback
        run: |
          python -m pip install 'playwright>=1.56,<2'
          # Most hosted Ubuntu runners have the needed shared libraries.
          # Skip slow apt resolution unless a browser launch proves otherwise.
          python -m playwright install chromium
          if ! python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as api:
              browser = api.chromium.launch(headless=True, args=["--no-sandbox"])
              browser.close()
          PY
          then
            python -m playwright install-deps chromium
          fi
      - name: Test desktop/mobile interactions and source-data receipts
        run: python scripts/visual_smoke.py --site website --out .runs/visual-smoke
      - name: Test local file commitments using a real packaged CLI bundle
        run: |
          python -m pip install -e .
          python scripts/check_browser.py --site website
      - name: Retain offline screenshots when browser QA fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: website-browser-failure
          path: .runs/visual-smoke
          if-no-files-found: ignore
          retention-days: 7

  graphwalks-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install public benchmark and official Google SDK prerequisites
        run: python -m pip install -e '.[graphwalks]'
      - name: Validate 200-row synthetic Parquet, token planning and paid-call guardrails
        run: python -m unittest discover -s tests -p test_graphwalks_runtime.py -v
      - name: Exercise one-POST Interactions REST transport on loopback
        run: python -m unittest discover -s tests -p test_gemini_rest.py -v
      - name: Verify OpenAI-only metadata readiness offline
        run: python -m unittest discover -s tests -p test_provider_readiness.py -v
      - name: Audit synthetic GraphWalks journals and adversarial tampering
        run: python -m unittest discover -s tests -p test_graphwalks_audit.py -v
      - name: Verify manual paid-pilot authorization and artifact-privacy contracts
        run: python -m unittest discover -s tests -p test_graphwalks_pilot_gate.py -v
      - name: Verify runtime CLI entry points without credentials
        run: |
          claim-replay plan-graphwalks --help
          claim-replay execute-graphwalks --help
          claim-replay export-graphwalks --help
          claim-replay audit-graphwalks --help
          claim-replay verify-graphwalks-public --help
          claim-replay report-graphwalks-public --help

  dependency-audit:
    # Separate dependency advisory check from experimental workflows.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve optional integrations in an isolated environment
        run: |
          mkdir -p .runs/dependency-audit
          python -m venv "$RUNNER_TEMP/target"
          "$RUNNER_TEMP/target/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/target/bin/python" -m pip install '.[inspect,graphwalks]' 'playwright>=1.56,<2'
          "$RUNNER_TEMP/target/bin/python" -m pip check
          "$RUNNER_TEMP/target/bin/python" -m pip list --format=freeze > .runs/dependency-audit/resolved.txt
          "$RUNNER_TEMP/target/bin/python" -m pip list --format=freeze --exclude model-claim-replay > .runs/dependency-audit/third-party.txt
      - name: Audit exact resolved third-party versions
        run: |
          python -m venv "$RUNNER_TEMP/auditor"
          "$RUNNER_TEMP/auditor/bin/python" -m pip install -r requirements-audit.txt
          "$RUNNER_TEMP/auditor/bin/python" -m pip_audit --strict --no-deps --disable-pip --progress-spinner off \
            -r .runs/dependency-audit/third-party.txt --format json --output .runs/dependency-audit/advisories.json
      - name: Retain dependency snapshot and advisory report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: dependency-audit
          path: .runs/dependency-audit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
