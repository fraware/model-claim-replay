name: OpenAI GraphWalks live preflight (no generation)
# Run once on main when this explicit validation workflow changes.
# Never trigger from PRs, schedules, or unrelated source changes.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/graphwalks-openai-preflight.yml'
permissions:
  contents: read
concurrency:
  group: graphwalks-openai-live-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned source reader
        run: python -m pip install -e '.[graphwalks]'
      - name: Independently verify original public dataset
        run: |
          python scripts/graphwalks_data_audit.py \
            --revision be6cc6ecf9b4d495b07d1ff53d2a16598e90fed7 \
            --sha256 537879431c72a42e3b500f80efc3047e7facb90390b6063d33679b4320985911 \
            --size-bytes 296903814 --retain-parquet --out .runs/private/openai-source
      - name: Count source-bound OpenAI input tokens only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          python scripts/openai_graphwalks_preflight.py \
            --parquet .runs/private/openai-source/graphwalks_256k_to_1mil.parquet \
            --index .runs/private/openai-source/graphwalks-bfs-reference-index.jsonl \
            --out .runs/openai-preflight
      - name: Retain score-free preflight evidence
        uses: actions/upload-artifact@v6
        with:
          name: openai-graphwalks-live-preflight
          path: |
            .runs/openai-preflight/public/plan.json
            .runs/openai-preflight/public/outcome.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
