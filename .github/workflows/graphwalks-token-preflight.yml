name: GraphWalks Gemini token preflight

# Explicit maintainer initiation only. No scheduling, pull-request triggers,
# paid generation, response scoring or automatic retries.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Number of pinned public BFS prompts to count"
        type: choice
        required: true
        default: "1"
        options:
          - "1"
          - "2"
          - "5"
          - "20"
          - "200"
      output_tokens:
        description: "Reserved maximum output tokens per future generation"
        type: choice
        required: true
        default: "16384"
        options:
          - "8192"
          - "16384"
          - "32768"
          - "65536"

permissions:
  contents: read

concurrency:
  group: graphwalks-gemini-token-preflight
  cancel-in-progress: false

jobs:
  count-pinned-prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned-source reader and official token-count SDK
        run: python -m pip install -e '.[graphwalks]'
      - name: Select authenticated Gemini credential before source download
        id: gemini_credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
        run: python scripts/graphwalks_select_gemini_secret.py --alias-only
      - name: Verify complete public source and retain locally only
        run: |
          python scripts/graphwalks_data_audit.py \
            --revision be6cc6ecf9b4d495b07d1ff53d2a16598e90fed7 \
            --sha256 537879431c72a42e3b500f80efc3047e7facb90390b6063d33679b4320985911 \
            --size-bytes 296903814 \
            --retain-parquet \
            --out .runs/private/graphwalks-preflight
      - name: Count provider tokens for selected source prompts only
        env:
          GEMINI_API_KEY: ${{ (steps.gemini_credential.outputs.alias == 'GEMINI_API_KEY' && secrets.GEMINI_API_KEY) || (steps.gemini_credential.outputs.alias == 'GOOGLE_API_KEY' && secrets.GOOGLE_API_KEY) || (steps.gemini_credential.outputs.alias == 'GOOGLE_GENAI_API_KEY' && secrets.GOOGLE_GENAI_API_KEY) || '' }}
        run: |
          claim-replay plan-graphwalks \
            --parquet .runs/private/graphwalks-preflight/graphwalks_256k_to_1mil.parquet \
            --index .runs/private/graphwalks-preflight/graphwalks-bfs-reference-index.jsonl \
            --max-tasks "${{ inputs.tasks }}" \
            --max-output-tokens "${{ inputs.output_tokens }}" \
            --thinking-level xhigh \
            --out .runs/private/graphwalks-preflight/token-plan.json
      - name: Upload score-free token receipt only
        uses: actions/upload-artifact@v6
        with:
          name: graphwalks-gemini-token-count-only
          path: .runs/private/graphwalks-preflight/token-plan.json
          if-no-files-found: error
          retention-days: 90
