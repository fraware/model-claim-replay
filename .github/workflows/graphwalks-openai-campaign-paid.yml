name: OpenAI GraphWalks 16-task paid campaign (retired dispatch)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse duplicate campaign authorization
        run: |
          echo 'This frozen cohort has a separate one-time authorization record. Review its evidence; no further requests are authorized.'
          exit 1
