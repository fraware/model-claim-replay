name: Stage unpublished v0.1.0 release draft (temporary branch)
on:
  push:
    branches:
      - staging/retain-v0-1-0-release-draft
    paths:
      - '.github/workflows/stage-release-draft-once.yml'
permissions:
  actions: read
  contents: write
concurrency:
  group: stage-v0-1-0-release-draft
  cancel-in-progress: false
jobs:
  stage:
    if: ${{ github.repository == 'fraware/model-claim-replay' && github.ref == 'refs/heads/staging/retain-v0-1-0-release-draft' && github.event_name == 'push' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: fraware/model-claim-replay
    steps:
      - name: Verify frozen source and download exact tested artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected=c5f4d6ecc0a187c644af205fa07c1fa44250e9e9
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = "$expected"
          test "$(gh api repos/$GH_REPO/actions/runs/45615489473 --jq '.head_sha + ":" + .conclusion')" = "$expected:success"
          test "$(gh api repos/$GH_REPO/actions/runs/45615489556 --jq '.head_sha + ":" + .conclusion')" = "$expected:success"
          test -z "$(gh api --paginate repos/$GH_REPO/releases --jq '.[] | select(.tag_name == "v0.1.0") | .id')"
          test "$(gh api repos/$GH_REPO/git/matching-refs/tags/v0.1.0 --jq '[.[] | select(.ref == "refs/tags/v0.1.0")] | length')" = 0
          mkdir "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/release-assets"
          gh api repos/$GH_REPO/actions/artifacts/15022510313/zip > model-claim-replay-candidate-linux.zip
          gh api repos/$GH_REPO/actions/artifacts/15021878581/zip > model-claim-replay-candidate-macos.zip
          gh api repos/$GH_REPO/actions/artifacts/15021903881/zip > model-claim-replay-candidate-windows.zip
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile
          expected = {
              "linux": (15022510313, 1309463, "36b011467b1bf3d64735ce1b8b04541a8403f91ffacf57867beea137d9373058"),
              "macos": (15021878581, 1310574, "5118f735857d2aaab8abbc2ab2800b6e36c2e18c962a640eb5592d38541c6213"),
              "windows": (15021903881, 1309716, "a93d29c2cdaeb23ef6368bd10abbb8e6c7c99f058b7404180a4d54ec1017f394"),
          }
          revision = "c5f4d6ecc0a187c644af205fa07c1fa44250e9e9"
          package_names = {"model_claim_replay-0.1.0-py3-none-any.whl", "model_claim_replay-0.1.0.tar.gz"}
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          receipts = {}
          for platform, (artifact, size, sha) in expected.items():
              path = Path(f"model-claim-replay-candidate-{platform}.zip")
              assert path.stat().st_size == size and digest(path.read_bytes()) == sha
              with zipfile.ZipFile(path) as z:
                  assert len(z.namelist()) == 3 and set(z.namelist()) == package_names | {"verification.json"}
                  receipt = json.loads(z.read("verification.json"))
                  assert receipt["revision"] == revision
                  assert receipt["offline_wheel_install_and_demo_verified"] is True
                  assert receipt["source_snapshot_archived_evidence_verified"] is True
                  assert receipt["source_snapshot_tracked_files_verified"] == 165
                  assert receipt["external_user_session"] is False
                  assert receipt["public_release_published"] is False
                  assert set(receipt["artifacts"]) == package_names
                  for name in package_names:
                      raw = z.read(name)
                      assert receipt["artifacts"][name]["bytes"] == len(raw)
                      assert receipt["artifacts"][name]["sha256"] == digest(raw)
                      if platform == "linux":
                          Path(name).write_bytes(raw)
                  receipts[platform] = {"artifact_id": artifact, "zip_sha256": sha, "receipt": receipt}
          Path("candidate-verification.json").write_text(json.dumps({
              "schema_version": "release-draft-candidate-v1",
              "revision": revision,
              "source_ci_run": 45615489473,
              "external_review_complete": False,
              "packages": receipts,
          }, indent=2, sort_keys=True) + "\n")
          assets = sorted(p for p in Path(".").iterdir() if p.is_file())
          Path("SHA256SUMS.txt").write_text("".join(f"{digest(p.read_bytes())}  {p.name}\n" for p in assets))
          PY
          sha256sum -c SHA256SUMS.txt
      - name: Create only an unpublished release draft and attach validated files
        shell: bash
        run: |
          set -euo pipefail
          expected=c5f4d6ecc0a187c644af205fa07c1fa44250e9e9
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = "$expected"
          test -z "$(gh api --paginate repos/$GH_REPO/releases --jq '.[] | select(.tag_name == "v0.1.0") | .id')"
          test "$(gh api repos/$GH_REPO/git/matching-refs/tags/v0.1.0 --jq '[.[] | select(.ref == "refs/tags/v0.1.0")] | length')" = 0
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          # Model Claim Replay v0.1.0 — unpublished review candidate

          Candidate revision: c5f4d6ecc0a187c644af205fa07c1fa44250e9e9.

          Audit published AI benchmark claims using source commitments, reproducible scoring, explicit exclusions and original evidence.

          - Lightweight dependency-free CLI, synthetic offline demo and browser-local file checker.
          - Source-linked claims, evidence reports, Inspect AI import and GraphWalks tools.
          - Original OpenAI pilot and 16-task campaign archives and pinned public reference data. Eight campaign tasks graded, eight context-blocked; recorded conditional mean F1 0.875. Seven disclosed scores recomputed; one parser failure withheld. No publisher aggregate reproduced.
          - All 12 exact-revision mainline tests passed, including Linux/macOS/Windows packages and 165 tracked source files checked in the complete source distribution. Provider readiness passed with no inference.

          Attached: tested Linux wheel and complete source distribution, three original platform-specific CI ZIPs, the candidate verification receipt and SHA256SUMS.txt. These are the exact tested files, not rebuilt packages. The wheel is platform-independent; the source distribution includes public benchmark reference answers. Byte-identical archive rebuilds are not established.

          Review gates: five independent developer attempts, independent scientific review and the owner's explicit publication decision remain outstanding. No external onboarding or full-answer extraction validation is asserted. Provider origin and invoice accuracy are not independently authenticated. Do not publish this draft until the release acceptance decisions are recorded.

          [Exact mainline CI](https://github.com/fraware/model-claim-replay/actions/runs/45615489473) · [Reviewer guide](https://github.com/fraware/model-claim-replay/blob/c5f4d6ecc0a187c644af205fa07c1fa44250e9e9/docs/REVIEWER_GUIDE.md) · [Release gates](https://github.com/fraware/model-claim-replay/issues/5)
          NOTES
          gh release create v0.1.0 --repo "$GH_REPO" --draft --target "$expected" --title "Model Claim Replay v0.1.0 — review candidate" --notes-file "$RUNNER_TEMP/release-notes.md"
          test "$(gh release view v0.1.0 --repo "$GH_REPO" --json isDraft --jq '.isDraft|tostring')" = true
          test "$(gh release view v0.1.0 --repo "$GH_REPO" --json targetCommitish --jq .targetCommitish)" = "$expected"
          gh release upload v0.1.0 --repo "$GH_REPO" "$RUNNER_TEMP"/release-assets/*
          gh release view v0.1.0 --repo "$GH_REPO" --json isDraft,targetCommitish,url,assets > "$RUNNER_TEMP/draft.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          release = json.loads((root / "draft.json").read_text())
          assert release["isDraft"] is True
          assert release["targetCommitish"] == "c5f4d6ecc0a187c644af205fa07c1fa44250e9e9"
          local = {p.name: p for p in (root / "release-assets").iterdir()}
          assert len(local) == len(release["assets"]) == 7
          for asset in release["assets"]:
              p = local[asset["name"]]
              assert p.stat().st_size == asset["size"]
              if asset.get("digest") is not None:
                  assert asset["digest"] == "sha256:" + hashlib.sha256(p.read_bytes()).hexdigest()
          print(json.dumps(release, indent=2))
          PY
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = "$expected"
