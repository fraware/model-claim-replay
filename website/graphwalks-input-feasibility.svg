<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">100 of 200 candidate prompts exceed the input limit</title>
  <desc id="description">Gemini 4 Neon token-count audit, 23 November 2026. Two ranges on a common linear axis. Shorter inputs: 354,061–355,496 tokens, 100 of 100 within limit. Longer inputs: 1,419,001–1,420,682 tokens, 100 of 100 above the 1,048,576 input limit. No model generation. Google's publisher-selected cohort is unverified; the reported score is neither confirmed nor refuted. Source: github.com/fraware/model-claim-replay/actions/runs/45159511810</desc>
  <rect width="1200" height="440" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202124">
    <text x="42" y="42" font-size="19" font-weight="700" letter-spacing="1.2" fill="#555960">GRAPHWALKS / INPUT FEASIBILITY</text>
    <text x="1158" y="42" text-anchor="end" font-size="19" fill="#555960">23 Nov 2026</text>
    <text x="42" y="89" font-size="35" font-weight="700">100 of 200 candidate prompts exceed the input limit</text>
    <text x="42" y="121" font-size="22" fill="#555960">Gemini 4 Neon · Original public BFS prompts · Token counts only</text>
    <line x1="42" x2="1158" y1="145" y2="145" stroke="#d5d7da"/>
    <rect x="902.250" y="196" width="237.750" height="118" fill="#f3f4f5"/>
    <line id="input-limit" x1="902.250" x2="902.250" y1="196" y2="314" stroke="#34383e" stroke-width="2" stroke-dasharray="5 5"/>
    <text id="limit-label" x="902.250" y="181" text-anchor="middle" font-size="21" font-weight="700">1,048,576 limit</text>
    <g id="group-0" data-count="100" data-min="354061" data-max="355496">
      <text x="42" y="215" font-size="24" font-weight="700">Shorter inputs</text>
      <text x="42" y="243" font-size="20" fill="#393e46">100 / 100 within limit</text>
      <line x1="350" x2="1140" y1="220" y2="220" stroke="#d5d7da" stroke-width="1"/>
      <line class="range" x1="536.472" x2="537.228" y1="220" y2="220" stroke="#393e46" stroke-width="5"/>
      <circle cx="536.850" cy="220" r="6" fill="#393e46"/>
      <text x="552.85" y="208" text-anchor="start" font-size="21" font-weight="700" fill="#393e46">354,061–355,496</text>
    </g>
    <g id="group-1" data-count="100" data-min="1419001" data-max="1420682">
      <text x="42" y="277" font-size="24" font-weight="700">Longer inputs</text>
      <text x="42" y="305" font-size="20" fill="#a33b36">100 / 100 above limit</text>
      <line x1="350" x2="1140" y1="282" y2="282" stroke="#d5d7da" stroke-width="1"/>
      <line class="range" x1="1097.341" x2="1098.226" y1="282" y2="282" stroke="#a33b36" stroke-width="5"/>
      <circle cx="1097.783" cy="282" r="6" fill="#a33b36"/>
      <text x="1130" y="270" text-anchor="end" font-size="21" font-weight="700" fill="#a33b36">1,419,001–1,420,682</text>
    </g>
    <line x1="350" x2="1140" y1="314" y2="314" stroke="#555960"/>
    <line x1="350.000" x2="350.000" y1="314" y2="321" stroke="#555960"/><text x="350.000" y="344" text-anchor="middle" font-size="20" fill="#555960">0</text>
    <line x1="613.333" x2="613.333" y1="314" y2="321" stroke="#555960"/><text x="613.333" y="344" text-anchor="middle" font-size="20" fill="#555960">0.5M</text>
    <line x1="876.667" x2="876.667" y1="314" y2="321" stroke="#555960"/><text x="876.667" y="344" text-anchor="middle" font-size="20" fill="#555960">1.0M</text>
    <line x1="1140.000" x2="1140.000" y1="314" y2="321" stroke="#555960"/><text x="1140.000" y="344" text-anchor="middle" font-size="20" fill="#555960">1.5M</text>
    <text x="745" y="373" text-anchor="middle" font-size="20" fill="#555960">Input tokens · linear scale</text>
    <line x1="42" x2="1158" y1="390" y2="390" stroke="#d5d7da"/>
    <text x="42" y="420" font-size="19" fill="#555960">No model generation. Published evaluation cohort unverified.</text>
    <text x="1158" y="420" text-anchor="end" font-size="19" fill="#555960">Source: Actions run 45159511810</text>
  </g>
</svg>
