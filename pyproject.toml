[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-claim-replay"
version = "0.1.0"
description = "Reproduce published AI model claims with inspectable evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Model Claim Replay contributors"}]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = []

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3.244"]
graphwalks = ["pyarrow>=18,<30", "google-genai>=2.34,<3"]

[project.scripts]
claim-replay = "model_claim_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_claim_replay = ["py.typed"]
